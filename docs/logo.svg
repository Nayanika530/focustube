<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Shield Outline -->
  <path d="M 64 24 C 84 24 96 34 96 52 C 96 78 72 96 64 102 C 56 96 32 78 32 52 C 32 34 44 24 64 24 Z" 
        fill="rgba(56, 189, 248, 0.12)" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Inner Play Triangle + Graduation Cap Motif -->
  <polygon points="56,48 56,76 78,62" fill="#ffffff" />
  
  <!-- Graduation cap accent bar on top -->
  <path d="M 46 42 L 64 34 L 82 42 L 64 50 Z" fill="#38bdf8" opacity="0.9" />
  <circle cx="64" cy="34" r="3" fill="#ffffff" />
</svg>
